name: CI

on:
  push:
    branches: [ main, develop, "feat/*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 🔍 Frontend Linting & Type Checking
  frontend-checks:
    name: Frontend (ESLint + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript check
        run: pnpm type-check

      - name: Build Next.js app
        run: pnpm build
        env:
          # Dummy values for build-time environment variables
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          CLERK_SECRET_KEY: sk_test_dummy

  # 🐍 Backend Linting & Type Checking
  backend-checks:
    name: Backend (Ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff linting
        run: ruff check --ignore B008,B904 .

      - name: Run Ruff formatting check
        run: ruff format --check .

      - name: Run mypy type checking
        run: mypy src/

  # 🧪 Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mb_test
          REDIS_URL: redis://localhost:6379/0
          MB_AUTH_AUDIENCE: mb-api
          CLERK_ISSUER: https://test.clerk.accounts.dev

  # 🐳 Docker Build Validation
  docker-builds:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [web, api]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile.dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: mb-${{ matrix.app }}:test

  # 🚀 Integration Test (Docker Compose)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks, docker-builds]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test environment file
        run: |
          cat > .env.test << EOF
          APP_ENV=test
          WEB_PORT=3000
          API_PORT=8000
          CORS_ORIGINS=["http://localhost:3000"]
          DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/mb_test
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=mb_test
          REDIS_URL=redis://redis:6379/0
          # Test auth values
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_dummy
          CLERK_SECRET_KEY=sk_test_dummy
          CLERK_ISSUER=https://test.clerk.accounts.dev
          MB_AUTH_AUDIENCE=mb-api
          MB_AUTH_JWKS_URL=https://test.clerk.accounts.dev/.well-known/jwks.json
          EOF

      - name: Start services
        run: |
          cd infra/dev
          cp ../../.env.test .env
          docker-compose up -d --build

      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c '
            until curl -f http://localhost:8000/health; do
              echo "Waiting for API..."
              sleep 2
            done
          '
          timeout 60 bash -c '
            until curl -f http://localhost:3000/healthz; do
              echo "Waiting for Web..."
              sleep 2
            done
          '

      - name: Run integration tests
        run: |
          # Test API health endpoint
          curl -f http://localhost:8000/health

          # Test web health endpoint
          curl -f http://localhost:3000/healthz

          echo "✅ All integration tests passed!"

      - name: Cleanup
        if: always()
        run: |
          cd infra/dev
          docker-compose down -v

  # ✅ All Checks Summary
  all-checks:
    name: All Checks Complete
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks, backend-tests, integration-test]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.frontend-checks.result }}" = "success" ] && \
             [ "${{ needs.backend-checks.result }}" = "success" ] && \
             [ "${{ needs.backend-tests.result }}" = "success" ] && \
             [ "${{ needs.integration-test.result }}" = "success" ]; then
            echo "✅ All checks passed successfully!"
            exit 0
          else
            echo "❌ One or more checks failed"
            echo "Frontend: ${{ needs.frontend-checks.result }}"
            echo "Backend: ${{ needs.backend-checks.result }}"
            echo "Tests: ${{ needs.backend-tests.result }}"
            echo "Integration: ${{ needs.integration-test.result }}"
            exit 1
          fi